[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host/Helper consent handshake UI. Wires the `consent` crate to Tauri windows and a global end-session hotkey. No screen capture, input injection, or real network transport lives here yet — those are later phases."

[build-dependencies]
tauri-build = "2"

[dependencies]
consent = { path = "../consent" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
