[package]
name = "signaling"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real cross-machine transport for consent::transport::PeerLink and the SDP/ICE exchange transport::signaling seals — a hand-rolled Phoenix-channel-over-WebSocket client speaking Supabase Realtime Broadcast (no official Rust SDK exists). Owns the one place session-related bytes actually leave the machine before a P2P WebRTC connection exists."

[dependencies]
consent = { path = "../consent" }
transport = { path = "../transport" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
