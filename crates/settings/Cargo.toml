[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host preferences (overlay visibility, in-session sounds). Pure data and defaults only; the desktop crate owns loading/saving and applying them to windows."

[dependencies]
serde = { version = "1", features = ["derive"] }
consent = { path = "../consent" }

[dev-dependencies]
serde_json = "1"
